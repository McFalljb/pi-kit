name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - name: Install pi 1.2.0 from test/ci/package-lock.json
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix test/ci
          echo "$PWD/test/ci/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Typecheck
        run: bash test/typecheck.sh
      - name: Unit tests
        run: node --test test/unit.test.ts
      - name: AGENTS.md merge tests
        run: bash test/merge.sh
      - name: Smoke tests
        run: bash test/smoke.sh
      - name: DEBUG dump p9
        if: failure()
        run: |
          D=$(ls -d /tmp/pi-kit-smoke.* | head -1)
          for f in p9.secs p9.exit p9.out p9.err p9.log; do echo "=== $f"; cat "$D/$f"; done
          echo "=== tree"; find "$D/subagents-tmp" "$D/tmp" -maxdepth 6 2>/dev/null | head -200
