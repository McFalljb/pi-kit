name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - name: Install pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.2.0
      - name: Typecheck
        run: bash test/typecheck.sh
      - name: Unit tests
        run: node --test test/unit.test.ts
      - name: AGENTS.md merge tests
        run: bash test/merge.sh
      - name: Smoke tests
        run: bash test/smoke.sh
