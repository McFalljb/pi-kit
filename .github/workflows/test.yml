name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - name: Install the pinned pi and recommended packages from test/ci/package-lock.json
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix test/ci
          echo "$PWD/test/ci/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Typecheck
        run: bash test/typecheck.sh
      - name: Unit tests
        run: node --test test/unit.test.ts
      - name: Contract tests (pins agree; internals the kit relies on)
        run: node --test test/contracts.test.ts
      - name: AGENTS.md merge tests
        run: bash test/merge.sh
      - name: Smoke tests
        run: PI_SUBAGENTS_DIR="$PWD/test/ci/node_modules/pi-subagents" bash test/smoke.sh
